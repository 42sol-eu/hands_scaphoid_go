# Scaphoid Color Configuration
colors:
  # Color for action verbs (exists, create, delete, copy, move, etc.)
  action:
    color: "blue"
    bold: true
  
  # Color for filesystem object types (file, directory, link, archive)
  type:
    color: "green"
    bold: true
  
  # Color for error messages
  error:
    color: "red"
    bold: true
  
  # Color for success messages
  success:
    color: "green"
    bold: true
  
  # Color for paths
  path:
    color: "green"
    bold: true
  
  # Color for keywords
  keyword:
    color: "green"
    bold: true

# Valid color values: black, red, green, yellow, blue, magenta, cyan, white
# Set bold to true or false for each color category

# Output formatting options
formatting:
  # Enable markdown-like formatting for console output
  # When true, success messages are prefixed with '- ' and errors with '> '
  markdown: true
  
  # Prefix for successful operations (markdown list item by default)
  success_prefix: "- ✓ "
  
  # Prefix for error messages (markdown blockquote by default)
  error_prefix: "> ✗ "
  
  heading_prefix: "\n## "  # Markdown heading prefix for section titles

  # Alternative options:
  # success_prefix: "✓ "  # Checkmark emoji
  # error_prefix: "✗ "    # X mark emoji
  # success_prefix: "* "  # Alternative markdown list
  # error_prefix: "! "    # Warning style
