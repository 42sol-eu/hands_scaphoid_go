version: '3'

vars:
  BINARY_DIR: ./bin
  CMD_DIR: ./cmd
  PKG_DIR: ./pkg
  TEST_DIR: ./tests
  DOCS_DIR: ./docs
  
  # List of all executables
  ACTION_COMMANDS: create,list,copy,move,delete,info,compare,backup
  OBJECT_COMMANDS: directory,file,link,archive

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  deps:
    desc: Download and install dependencies
    cmds:
      - go mod download
      - go mod tidy

  clean:
    desc: Clean built binaries and temporary files
    cmds:
      - rm -rf {{.BINARY_DIR}}
      - go clean -cache
      - go clean -testcache

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  lint:
    desc: Run linters
    cmds:
      - go vet ./...
      # Uncomment if you have golangci-lint installed
      # - golangci-lint run

  build:
    desc: Build the unified scaphoid CLI binary
    deps: [deps, fmt]
    cmds:
      - mkdir -p {{.BINARY_DIR}}
      - echo "Building unified scaphoid CLI..."
      - go build -o {{.BINARY_DIR}}/scaphoid .

  build:race:
    desc: Build the unified scaphoid CLI binary with race detection
    deps: [deps, fmt]
    cmds:
      - mkdir -p {{.BINARY_DIR}}
      - echo "Building scaphoid with race detection..."
      - go build -race -o {{.BINARY_DIR}}/scaphoid-race .

  test:
    desc: Run all tests
    deps: [fmt]
    cmds:
      - go test ./pkg/... -v
      - go test ./tests/... -v

  test:race:
    desc: Run tests with race detection
    deps: [fmt]
    cmds:
      - go test -race ./pkg/... -v
      - go test -race ./tests/... -v

  test:coverage:
    desc: Run tests with coverage
    deps: [fmt]
    cmds:
      - mkdir -p coverage
      - go test ./pkg/... ./tests/... -coverprofile=coverage/coverage.out -v
      - go tool cover -html=coverage/coverage.out -o coverage/coverage.html
      - echo "Coverage report generated at coverage/coverage.html"

  test:integration:
    desc: Run integration tests
    deps: [build]
    cmds:
      - go test ./tests/integration/... -v -tags=integration

  bench:
    desc: Run benchmarks
    cmds:
      - go test -bench=. ./pkg/... ./tests/...

  install:
    desc: Install scaphoid binary to GOPATH/bin
    deps: [build]
    cmds:
      - echo "Installing scaphoid to $GOPATH/bin"
      - cp {{.BINARY_DIR}}/scaphoid $GOPATH/bin/scaphoid

  install:local:
    desc: Install scaphoid binary to /usr/local/bin (requires sudo)
    deps: [build]
    cmds:
      - echo "Installing scaphoid to /usr/local/bin"
      - sudo cp {{.BINARY_DIR}}/scaphoid /usr/local/bin/scaphoid

  uninstall:
    desc: Uninstall scaphoid binary from GOPATH/bin
    cmds:
      - rm -f $GOPATH/bin/scaphoid

  uninstall:local:
    desc: Uninstall scaphoid binary from /usr/local/bin (requires sudo)
    cmds:
      - sudo rm -f /usr/local/bin/scaphoid

  run:demo:
    desc: Run a quick demo of the scaphoid CLI
    deps: [build]
    cmds:
      - echo "=== Scaphoid CLI Demo ==="
      - echo "Creating test directory..."
      - ./bin/scaphoid create directory /tmp/fstest || echo "Directory might already exist"
      - echo "Creating test file..."
      - ./bin/scaphoid file create /tmp/fstest/testfile.txt
      - echo "Listing directory contents..."
      - ./bin/scaphoid directory list /tmp/fstest
      - echo "Getting file info..."
      - ./bin/scaphoid info /tmp/fstest/testfile.txt
      - echo "Copying file..."
      - ./bin/scaphoid copy /tmp/fstest/testfile.txt /tmp/fstest/testfile_copy.txt
      - echo "Creating archive..."
      - ./bin/scaphoid create archive /tmp/fstest.tar.gz --source /tmp/fstest
      - echo "Listing archive contents..."
      - ./bin/scaphoid list /tmp/fstest.tar.gz
      - echo "Cleaning up..."
      - ./bin/scaphoid delete /tmp/fstest --recursive --force
      - rm -f /tmp/fstest.tar.gz
      - echo "Demo completed!"

  docs:
    desc: Generate documentation
    cmds:
      - task: docs:setup
      - task: docs:build

  docs:setup:
    desc: Setup Hugo documentation site
    cmds:
      - |
        if [ ! -d "{{.DOCS_DIR}}/site" ]; then
          cd {{.DOCS_DIR}}
          hugo new site site
          cd site
          git init
          git submodule add https://github.com/theNewDynamic/gohugo-theme-ananke themes/ananke
          echo "theme = 'ananke'" >> config.toml
        fi

  docs:build:
    desc: Build documentation with Hugo
    cmds:
      - cd {{.DOCS_DIR}}/site && hugo

  docs:serve:
    desc: Serve documentation locally
    cmds:
      - cd {{.DOCS_DIR}}/site && hugo server -D

  docs:clean:
    desc: Clean documentation build
    cmds:
      - rm -rf {{.DOCS_DIR}}/site/public

  release:
    desc: Build release binaries for multiple platforms
    deps: [clean, fmt, test]
    cmds:
      - mkdir -p releases
      - task: release:build

  release:build:
    desc: Build release binaries
    cmds:
      - |
        for os in linux darwin windows; do
          for arch in amd64 arm64; do
            if [ "$os" = "windows" ]; then
              ext=".exe"
            else
              ext=""
            fi
            
            echo "Building scaphoid for $os/$arch..."
            mkdir -p releases/$os-$arch
            
            GOOS=$os GOARCH=$arch go build -ldflags="-s -w" -o releases/$os-$arch/scaphoid$ext .
            
            # Create archive
            cd releases
            tar -czf scaphoid-$os-$arch.tar.gz $os-$arch/
            cd ..
          done
        done

  dev:
    desc: Development mode - watch for changes and rebuild
    deps: [build]
    cmds:
      - echo "Development mode - watching for changes..."
      - |
        while true; do
          inotifywait -r -e modify,create,delete cmd/ pkg/ 2>/dev/null || sleep 2
          echo "Changes detected, rebuilding..."
          task build
        done

  check:
    desc: Run all checks (format, lint, test)
    cmds:
      - task: fmt
      - task: lint  
      - task: test

  ci:
    desc: Continuous Integration - run all checks and build
    cmds:
      - task: check
      - task: build
      - task: test:coverage